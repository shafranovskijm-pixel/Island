name: Playable Prototype Android

on:
  push:
    branches:
      - v0.7-locations
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  prototype-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.6.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.6.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Validate Godot project
        run: godot --headless --path . --editor --quit

      - name: Run legacy prototype smoke test
        run: godot --headless --path . --script res://prototype/prototype_smoke_test.gd

      - name: Run systemic world smoke test
        run: godot --headless --path . --script res://prototype/prototype_systemic_smoke_test.gd

      - name: Run integrated scene smoke test
        run: godot --headless --path . --script res://prototype/prototype_scene_smoke_test.gd

      - name: Run contextual mobile action smoke test
        run: godot --headless --path . --script res://prototype/prototype_v04_smoke_test.gd

      - name: Boot current main scene headless
        run: godot --headless --path . --quit-after 5

      - name: Export Android debug APK
        run: |
          mkdir -p builds/android
          godot --headless --path . --export-debug "Android" builds/android/Island-Life-Prototype-debug.apk
          test -s builds/android/Island-Life-Prototype-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-Android
          path: builds/android/Island-Life-Prototype-debug.apk
          if-no-files-found: error
          retention-days: 7
