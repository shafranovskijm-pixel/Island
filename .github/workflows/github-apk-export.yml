name: Temporary Island APK Export

on:
  push:
    branches:
      - v0.7-locations
    paths:
      - .github/workflows/github-apk-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.6.3"
      GODOT_TEMPLATE_VERSION: "4.6.3.stable"
      APK_PATH: "builds/android/Island-Life-Prototype-v05.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "platforms;android-36"

      - name: Install Godot 4.6.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --retry 5 --retry-delay 3 --fail --location \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.x86_64&slug=linux.x86_64.zip&version=${GODOT_VERSION}" \
            --output "$RUNNER_TEMP/godot.zip"
          curl --retry 5 --retry-delay 3 --fail --location \
            "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${GODOT_VERSION}" \
            --output "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DEST"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DEST/"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
          test -f "$TEMPLATE_DEST/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/island-debug.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Island Prototype,O=Island Life,C=US"
          echo "DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit
          SETTINGS="$(find "$HOME/.config/godot" -type f -name 'editor_settings-*.tres' | head -n 1)"
          test -n "$SETTINGS"
          python3 - "$SETTINGS" <<'PY'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          values = {
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/android_sdk_path": os.environ["ANDROID_SDK_ROOT"],
              "export/android/debug_keystore": os.environ["DEBUG_KEYSTORE"],
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for key, value in values.items():
              safe = value.replace("\\", "/")
              line = f'{key} = "{safe}"'
              pattern = rf'(?m)^{re.escape(key)} = .*?$'
              text = re.sub(pattern, line, text) if re.search(pattern, text) else text + "\n" + line
          path.write_text(text)
          PY
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$APK_PATH"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          ls -lh "$APK_PATH" "$APK_PATH.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-v05
          path: |
            builds/android/Island-Life-Prototype-v05.apk
            builds/android/Island-Life-Prototype-v05.apk.sha256
          if-no-files-found: error
          retention-days: 7
