name: Prototype APK One Shot

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/prototype-apk-one-shot.yml'
  workflow_dispatch:

concurrency:
  group: prototype-apk-one-shot-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.6.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.6.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Validate project parses
        run: godot --headless --path . --editor --quit

      - name: Validate current mobile prototype
        run: godot --headless --path . --script res://prototype/prototype_v04_smoke_test.gd

      - name: Boot current main scene
        run: godot --headless --path . --quit-after 5

      - name: Export signed arm64 Android debug APK
        run: |
          mkdir -p builds/android
          godot --headless --path . --export-debug "Android" builds/android/Island-Life-Prototype-v04.apk
          test -s builds/android/Island-Life-Prototype-v04.apk

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-v04-APK
          path: builds/android/Island-Life-Prototype-v04.apk
          if-no-files-found: error
          retention-days: 7
