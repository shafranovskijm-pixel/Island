name: Prototype APK Slim Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/prototype-apk-slim.yml'
  workflow_dispatch:

concurrency:
  group: prototype-apk-slim-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-apk-slim:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/godot.zip"

      - name: Install Android export templates only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          TMP="$RUNNER_TEMP/templates-unpack"
          mkdir -p "$TMP"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$TMP"
          DEST="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$DEST"
          cp "$TMP/templates/android_debug.apk" "$DEST/android_debug.apk"
          cp "$TMP/templates/android_release.apk" "$DEST/android_release.apk"
          cp "$TMP/templates/version.txt" "$DEST/version.txt" || true
          rm -rf "$RUNNER_TEMP/templates.tpz" "$TMP"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/island-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Island Life,C=US"
          echo "DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Initialize and configure Godot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit
          SETTINGS="$(find "$HOME/.config/godot" -type f -name 'editor_settings-*.tres' | head -n 1)"
          test -n "$SETTINGS"
          python3 - "$SETTINGS" <<'PY'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          values = {
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/debug_keystore': os.environ['DEBUG_KEYSTORE'],
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in values.items():
              line = f'{key} = "{value}"'
              pat = rf'(?m)^{re.escape(key)} = .*?$'
              text = re.sub(pat, line, text) if re.search(pat, text) else text + '\n' + line
          path.write_text(text)
          PY
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Validate mobile prototype scripts
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_v04_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_v05_smoke_test.gd

      - name: Boot main scene headless
        shell: bash
        run: "$GODOT_BIN --headless --path . --quit-after 5"

      - name: Export signed arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/android
          "$GODOT_BIN" --headless --path . --export-debug "Android" builds/android/Island-Life-Prototype-v05.apk
          test -s builds/android/Island-Life-Prototype-v05.apk
          unzip -t builds/android/Island-Life-Prototype-v05.apk >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs builds/android/Island-Life-Prototype-v05.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-v05-Slim-APK
          path: builds/android/Island-Life-Prototype-v05.apk
          if-no-files-found: error
          retention-days: 7
