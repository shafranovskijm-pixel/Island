name: Island v05 Android Release Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-windows.yml'
  workflow_dispatch:

jobs:
  android-release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v05 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: pwsh
        run: |
          $yes = (("y`n") * 30)
          $yes | & sdkmanager.bat --licenses | Out-Null
          & sdkmanager.bat "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Godot 4.6.3 and Android export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "4.6.3"
          $godotZip = Join-Path $env:RUNNER_TEMP "godot.zip"
          $templatesZip = Join-Path $env:RUNNER_TEMP "templates.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip" -OutFile $godotZip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_export_templates.tpz" -OutFile $templatesZip
          $godotDir = Join-Path $env:RUNNER_TEMP "godot"
          $templatesDir = Join-Path $env:RUNNER_TEMP "templates"
          Expand-Archive -Path $godotZip -DestinationPath $godotDir -Force
          Expand-Archive -Path $templatesZip -DestinationPath $templatesDir -Force
          $godot = Get-ChildItem $godotDir -Filter "Godot_v*_win64.exe" | Select-Object -First 1
          if (-not $godot) { throw "Godot executable not found" }
          $templateDest = Join-Path $env:APPDATA "Godot\export_templates\4.6.3.stable"
          New-Item -ItemType Directory -Force -Path $templateDest | Out-Null
          Copy-Item -Path (Join-Path $templatesDir "templates\*") -Destination $templateDest -Recurse -Force
          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Android debug keystore
        shell: pwsh
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP "island-v05-debug.keystore"
          & keytool -genkeypair -keystore $keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Island Prototype,O=Island Life,C=US"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DEBUG_KEYSTORE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import project and configure Android paths
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $settings = Get-ChildItem (Join-Path $env:APPDATA "Godot") -Recurse -Filter "editor_settings-*.tres" | Select-Object -First 1
          if (-not $settings) { throw "Godot editor settings not found" }
          $script = @'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          values = {
              'export/android/java_sdk_path': os.environ['JAVA_HOME'].replace('\\', '/'),
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'].replace('\\', '/'),
              'export/android/debug_keystore': os.environ['DEBUG_KEYSTORE'].replace('\\', '/'),
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in values.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)} = .*?$'
              text = re.sub(pattern, line, text) if re.search(pattern, text) else text + '\n' + line
          path.write_text(text)
          '@
          $py = Join-Path $env:RUNNER_TEMP "configure_godot.py"
          Set-Content -Path $py -Value $script -Encoding utf8
          python $py $settings.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT_BIN --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Godot project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --editor --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run prototype smoke tests
        shell: pwsh
        run: |
          $tests = @(
            "res://prototype/prototype_smoke_test.gd",
            "res://prototype/prototype_systemic_smoke_test.gd",
            "res://prototype/prototype_scene_smoke_test.gd",
            "res://prototype/prototype_v04_smoke_test.gd",
            "res://prototype/prototype_v05_smoke_test.gd"
          )
          foreach ($test in $tests) {
            & $env:GODOT_BIN --headless --path . --script $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Boot current v05 main scene
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --quit-after 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export and verify Android ARM64 APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "builds/android" | Out-Null
          $apk = "builds/android/Island-Life-Prototype-v05.apk"
          & $env:GODOT_BIN --headless --path . --export-debug "Android" $apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $apk)) { throw "APK not created" }
          $info = Get-Item $apk
          if ($info.Length -le 0) { throw "APK is empty" }
          $apksigner = Join-Path $env:ANDROID_HOME "build-tools\35.0.1\apksigner.bat"
          & $apksigner verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "APK size: $($info.Length) bytes"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-v05-APK-Windows
          path: builds/android/Island-Life-Prototype-v05.apk
          if-no-files-found: error
          retention-days: 14
