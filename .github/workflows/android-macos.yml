name: Island v05 Android Release macOS

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-macos.yml'
  workflow_dispatch:

jobs:
  android-release-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v05 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.6.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.6.3"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/godot/Godot.app" 2>/dev/null || true
          GODOT_BIN="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/island-v05-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Island Prototype,O=Island Life,C=US"
          echo "DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Import project and configure Android paths
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit
          SETTINGS="$(find "$HOME/Library/Application Support/Godot" -type f -name 'editor_settings-*.tres' | head -n 1)"
          test -n "$SETTINGS"
          python3 - "$SETTINGS" <<'PY'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          values = {
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/debug_keystore': os.environ['DEBUG_KEYSTORE'],
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in values.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)} = .*?$'
              text = re.sub(pattern, line, text) if re.search(pattern, text) else text + '\n' + line
          path.write_text(text)
          PY
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Validate Godot project
        shell: bash
        run: "$GODOT_BIN --headless --path . --editor --quit"

      - name: Run prototype smoke tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_systemic_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_scene_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_v04_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script res://prototype/prototype_v05_smoke_test.gd

      - name: Boot current v05 main scene
        shell: bash
        run: "$GODOT_BIN --headless --path . --quit-after 5"

      - name: Export and verify Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/android
          APK="builds/android/Island-Life-Prototype-v05.apk"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Island-Life-Prototype-v05-APK-macOS
          path: builds/android/Island-Life-Prototype-v05.apk
          if-no-files-found: error
          retention-days: 14
